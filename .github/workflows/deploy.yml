name: Deploy Bot to VPS

on:
  push:
    branches:
      - main # Jalankan otomatis setiap ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Pindah ke folder bot di VPS
            cd /opt/wa-premium-bot
            
            # Tarik update terbaru dari Github
            git pull origin main
            
            # Install package baru jika ada
            npm install --production
            
            # Restart bot
            pm2 restart wa-premium-bot
